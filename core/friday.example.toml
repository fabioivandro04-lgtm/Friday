# Configuração da Friday. Copia para friday.toml e ajusta.
# Segredos (chave do OpenRouter, token) NÃO vão aqui: põe-nos em core/.env.

[stt]
# Modelo do faster-whisper usado para ouvir.
model = "large-v3-turbo"
# "cuda" para a GPU NVIDIA, "cpu" se não houver GPU.
device = "cuda"

[llm]
# "local" (Ollama, grátis) ou "cloud" (OpenRouter).
provider = "local"
# Modelo local no Ollama (alternativa mais inteligente: "qwen3:14b").
local_model = "qwen3:8b"
ollama_url = "http://localhost:11434/v1"
# Opcional: modelo do OpenRouter (precisa de OPENROUTER_API_KEY no .env).
# cloud_model = "openai/gpt-4o-mini"
# Segundos sem resposta até a Friday dizer "Deixa-me ver…".
slow_threshold_s = 2.0

[tts]
# IDs das vozes Piper; são descarregadas automaticamente na primeira vez.
voice_pt = "pt_PT-tugão-medium"
voice_en = "en_GB-alan-medium"
download_dir = "models/piper"

[server]
# 0.0.0.0 para o telemóvel chegar pelo Tailscale; só IPs locais/Tailscale são aceites.
host = "0.0.0.0"
port = 8765

[memory]
db_path = "friday.db"
# Semelhança mínima para uma memória ser usada numa resposta (0–1).
min_similarity = 0.35

[wake]
# Modo "sempre à escuta": a Friday só responde depois de ouvir o nome dela.
# Desligado = falas com Ctrl+Shift+Espaço ou com o botão do microfone.
enabled = false
phrases = ["friday"]
# Segundos em que continua a ouvir depois da última frase.
window_s = 15.0

[integrations]
timezone = "Europe/Lisbon"
# Tokens e client_secret.json do Google ficam aqui (nunca vão para o Git).
secrets_dir = "secrets"
# Outlook / Microsoft 365: o "Application (client) ID" da tua app no Azure (ver README).
# microsoft_client_id = "00000000-0000-0000-0000-000000000000"
# Conta usada para enviar e marcar quando não dizes qual: "google" ou "microsoft".
# default_provider = "google"
