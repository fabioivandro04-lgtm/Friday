[project]
name = "friday-core"
version = "0.1.0"
description = "Friday Core — assistente de voz local em tempo real"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ddgs==9.16.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["gpu: precisa de GPU NVIDIA, modelos e Ollama (ignorado no CI)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
