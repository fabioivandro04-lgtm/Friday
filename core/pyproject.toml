[project]
name = "friday-core"
version = "0.1.0"
description = "Friday Core — assistente de voz local em tempo real"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ddgs==9.16.0",
    "fastapi==0.143.3",
    "fastembed==0.9.0",
    "google-auth==2.62.0",
    "google-auth-oauthlib==1.5.0",
    "msal==1.39.0",
    "nvidia-ml-py==13.615.71",
    "pipecat-ai[local-smart-turn-v3,openai,piper,silero,websocket,whisper]==1.12.0",
    "sqlite-vec==0.1.9",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Os testes "gpu" só correm quando pedidos: uv run pytest -m gpu
addopts = ["-m", "not gpu"]
markers = ["gpu: precisa de GPU NVIDIA, modelos e Ollama (ignorado no CI)"]
# Aviso vindo do Pipecat (usa audioop), não do nosso código.
filterwarnings = [
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore:`AudioContextTTSService` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
